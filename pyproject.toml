[project]
name = "real-estate-mcp"
version = "0.1.0"
description = "부동산 매물 관리 시스템 - MCP 서버 + Discord 봇"
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.0",
    "anthropic>=0.40",
    "asyncpg>=0.30",
    "discord.py>=2.4",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
