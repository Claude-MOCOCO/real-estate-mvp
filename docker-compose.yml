services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: mcp_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://mcp_user:password@db:5432/real_estate
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata:
